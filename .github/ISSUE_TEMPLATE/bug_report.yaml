name: Bug Report
description: Report a bug in the BP Water Heaters private ERP system
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Use this private tracker for BP Water Heaters business-system bugs only.
        Remove secrets, payment data, tokens, and customer-private details before submitting.

  - type: textarea
    id: bug-info
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and reproduction steps.
      placeholder: Describe the issue and the steps needed to reproduce it.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Select the affected BP Water Heaters system area.
      multiple: true
      options:
        - public site
        - booking
        - Stripe payments
        - accounting
        - tax rules
        - customer portal
        - admin web
        - mobile app
        - deployment
        - ERPNext core
        - other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share environment, branch, deployment, and relevant ERP runtime versions if known.
      placeholder: |
        Environment -
        Branch or deployment -
        ERPNext runtime version -
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      description: Paste sanitized logs only. Do not include secrets, tokens, payment data, or private customer details.
      render: shell
