{% extends "templates/web.html" %}

{% block footer %}{% endblock %}

{% block head_include %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bp_water_heaters/css/bpwh.css">
{% endblock %}

{% block page_content %}
<main class="bpwh-site bpwh-portal">
	<nav class="bpwh-nav bpwh-nav--portal" aria-label="BP Water Heaters portal">
		<a class="bpwh-brand" href="/bpwaterheaters" aria-label="BP Water Heaters home">
			<img src="/assets/bp_water_heaters/images/bpwh-mark.svg" alt="">
			<span>BP Water Heaters</span>
		</a>
		<div class="bpwh-nav__actions">
			<a href="tel:+17758159875">775-815-9875</a>
		</div>
	</nav>

	<section class="bpwh-section bpwh-section--portal-app" aria-labelledby="portal-app-title">
		<div class="bpwh-section__intro">
			<p class="bpwh-kicker">Customer portal</p>
			<h1 id="portal-app-title">Your BP Water Heaters record.</h1>
			<p id="bpwh-portal-intro">Loading bookings, jobs, invoices, and chat.</p>
		</div>
		<div class="bpwh-portal-grid" id="bpwh-portal-app" aria-live="polite"></div>
	</section>
</main>
<script src="/assets/bp_water_heaters/js/bpwh_portal.js"></script>
{% endblock %}
